<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rememo — overview</title>
<style>
  /* Rendered headless into assets/screenshots/00-overview.png by render-overview.ps1.
     Layout numbers here are the source of truth: canvas 1500x1060, hero on the left,
     four feature cards tilted down the right edge, overlapping each other and the hero.

     Each feature card is a .tilt wrapper (absolute position + rotation) around a .shot
     (the rounded, shadowed image). The label pill lives inside the wrapper, so it is
     anchored to the card's own corner — the gap is identical for all four — and is
     counter-rotated to stay upright. */
  html, body { margin: 0; padding: 0; }
  body {
    width: 1500px; height: 1060px; overflow: hidden; position: relative;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(760px 540px at 10% 6%,  rgba(176,160,240,.55), transparent 72%),
      radial-gradient(620px 440px at 90% 4%,  rgba(244,205,182,.42), transparent 72%),
      radial-gradient(760px 560px at 78% 94%, rgba(184,204,240,.48), transparent 72%),
      linear-gradient(165deg, #efeafc 0%, #f7f5fd 58%, #fbfaff 100%);
  }

  .shot {
    position: relative; border-radius: 13px; overflow: hidden; background: #fff;
    box-shadow:
      0 1px 2px  rgba(38, 32, 66, .05),
      0 8px 18px rgba(38, 32, 66, .09),
      0 26px 54px rgba(38, 32, 66, .12);
  }
  .shot img { display: block; width: 100%; height: auto; }

  .hero {
    position: absolute; left: 60px; top: 128px; width: 980px;
    box-shadow: 0 2px 4px rgba(38,32,66,.05), 0 14px 30px rgba(38,32,66,.10), 0 44px 80px rgba(38,32,66,.14);
  }

  /* one aligned column: the tilt and the overlap carry the "scattered" feel */
  .tilt { position: absolute; left: 1015px; width: 420px; }
  .tilt .shot { width: 100%; }
  /* the four feature cards sit behind the hero: a hair of blur keeps them as context
     instead of competing with it (tune the blur radius here) */
  .tilt .shot { filter: blur(.1px); }
  .c1 { top: 52px;  transform: rotate(-3.2deg); }
  .c2 { top: 276px; transform: rotate( 2.6deg); }
  .c3 { top: 500px; transform: rotate(-2.2deg); }
  .c4 { top: 724px; transform: rotate( 3.4deg); }

  /* the label sits on the card's top edge and tilts with it (a tag on the border) */
  .pill {
    position: absolute; top: -14px; left: 14px; z-index: 10; white-space: nowrap;
    padding: 6px 13px; border-radius: 999px; background: rgba(255,255,255,.97);
    color: #3b3468; font-size: 17px; font-weight: 600; line-height: 1.15;
    box-shadow: 0 2px 10px rgba(38,32,66,.16), 0 0 0 1px rgba(255,255,255,.6);
  }
</style>
</head>
<body>
  <div class="shot hero"><img src="../../assets/screenshots/01-main{SUFFIX}.png" alt=""></div>

  <div class="tilt c1"><div class="shot"><img src="../../assets/screenshots/02-editor{SUFFIX}.png" alt=""></div><span class="pill">{PILL1}</span></div>
  <div class="tilt c2"><div class="shot"><img src="../../assets/screenshots/03-tags{SUFFIX}.png" alt=""></div><span class="pill">{PILL2}</span></div>
  <div class="tilt c3"><div class="shot"><img src="../../assets/screenshots/04-recycle{SUFFIX}.png" alt=""></div><span class="pill">{PILL3}</span></div>
  <div class="tilt c4"><div class="shot"><img src="../../assets/screenshots/05-references{SUFFIX}.png" alt=""></div><span class="pill">{PILL4}</span></div>
</body>
</html>
