name: Release Obsidian plugin

# Pushing a tag creates the GitHub release automatically.
# The release assets are the artifacts committed in the repo — the workflow does
# NOT rebuild, so what users download is exactly the build that was reviewed.
# Local flow: pnpm build -> commit main.js/styles.css -> tag -> push tag.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write # actions/attest 需要（OIDC）
  attestations: write # 写构建证明

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest.json version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          echo "tag=${tag} manifest=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Tag '${tag}' does not match manifest.json version '${version}'. Bump manifest.json + versions.json, commit, then push a matching tag."
            exit 1
          fi
          node -e "
            const v = require('./versions.json');
            if (!(process.env.TAG in v)) {
              console.error('::error::versions.json has no entry for ' + process.env.TAG);
              process.exit(1);
            }
          "
        env:
          TAG: ${{ github.ref_name }}

      - name: Check release assets are committed
        run: |
          for f in main.js manifest.json styles.css; do
            if [ ! -f "${f}" ]; then
              echo "::error::${f} is missing from the repository — run 'pnpm build' and commit the artifacts before tagging."
              exit 1
            fi
          done

      # 构建证明（社区审查建议）：让用户可核验发布物出自本仓库的这次运行。
      # 先证明再发布：证明失败就不出 Release，避免发一个缺证明的版本。
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Rememo ${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
          draft: false
          prerelease: false
